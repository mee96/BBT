<main class="user-page">

  <div class="user-container">

    <img src="assets/macaron.png" alt="macaron" class="deco-img" />

    <div class="pbox">
      <div class="titlebar">
        <span class="tb-dot" style="background:#ff5f57"></span>
        <span class="tb-dot" style="background:#febc2e"></span>
        <span class="tb-dot" style="background:#28c840"></span>
        <span class="tb-title">user.exe</span>
      </div>
      <div class="user-inner">

        @if (user$ | async; as user) {
          <div class="user-info">
            <i class="fa-solid fa-circle-user user-icon"></i>
            <p class="user-email">{{ user.email }}</p>
          </div>
          <button class="btn-logout" (click)="logout()">
            tancar sessió →
          </button>
        }

      </div>
    </div>

  </div>

</main>
